name: Building and Running in Docker Workflow

on: push

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unit Tests
        run: mvn test
      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          directory: ./target/site/jacoco
          flags: Unit Tests
          verbose: true

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Integration Tests
        run: |
          docker build -t database ./db
          docker run --name world -dp 33060:3306 database
          sleep 30
          mvn test -Dgroups=integration -Dtest.excluded=none
          docker stop world
          docker rm world
          docker image rm database
      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          directory: ./target/site/jacoco
          flags: Integration Tests # optional
          verbose: true # optional (default = false)

  build:
    name: Building our Application
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Run docker compose
        run: docker compose up --build --abort-on-container-exit
      - name: Deploy to GitHub Releases
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}${{ github.ref == 'refs/heads/release' && '-rc' || '' }}
          name: v${{ steps.version.outputs.version }}${{ github.ref == 'refs/heads/release' && ' (release candidate)' || '' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref == 'refs/heads/release' }}
          generate_release_notes: true
          files: ./target/*-jar-with-dependencies.jar
      - name: Push master onto release branch
        if: github.ref == 'refs/heads/master'
        run: git push origin HEAD:refs/heads/release