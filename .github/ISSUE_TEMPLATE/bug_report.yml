name: Bug report
description: Report a bug in the system
title: "[BUG] "
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in every section so we can reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Run the app/test
        2. Call report '...' with input '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened. Paste console output or a stack trace.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Branch / version
      placeholder: e.g. develop, v0.1.2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: e.g. 17

  - type: dropdown
    id: running-via
    attributes:
      label: Running via
      options:
        - IntelliJ
        - Docker
        - GitHub Actions
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database container running?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drag screenshots in here.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else about the problem.
